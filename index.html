cost is dominated by a long, repeated system prompt and a large retrieved context per request.\nWhich optimization most directly targets the dominant cost driver? (duplicate of Q55)","options":{"A":"Add additional repeated content to the system prompt to give the model more guidance.","B":"Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them.","C":"Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query.","D":"Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver."}},{"id":84,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"A","question":"A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents.\nWhich mitigation is most directly targeted at this failure mode?","options":{"A":"Constrain responses to source-supported content, require citations, and add a verification step.","B":"Score each new model version against a stable adversarial evaluation set.","C":"Replace the shared API key with per-user OAuth tokens to restrict data access.","D":"Treat retrieved data as untrusted and apply input classifiers at ingestion time."}},{"id":85,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"D","question":"Engineering leadership wants to roll out Claude Skills to 280 developers across 14 teams. Skills will encode internal coding standards, code-review checklists, and incident-postmortem templates. Leadership asked how to govern Skill authorship so that Skills remain trustworthy without bottlenecking on a single central team.\nWhich governance model should you recommend?","options":{"A":"Per-developer authorship across the 280 engineers with no team-level coordination required.","B":"Centralized authorship by a single platform team responsible for every Skill produced.","C":"Fully decentralized authorship across the 14 teams with no review before publication.","D":"Federated authorship across the 14 teams with a central review and publication gate."}},{"id":86,"domain":"practice-set-6","is_multi":true,"num_answers":2,"answer":"A,D","question":"You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration.\nWhich two steps must be completed BEFORE piloting the configuration with a small group of engineers? (Select two.)","options":{"A":"Define the project-scope baseline covering Model Context Protocol (MCP) servers, permission rules, and subagents.","B":"Onboard every engineer in the organization to the new configuration through mandatory training sessions.","C":"Roll out the stabilized configuration to additional teams with documentation and a defined support channel.","D":"Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope.","E":"Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout."}},{"id":87,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"B","question":"You are preparing a HIPAA-eligible deployment for a healthcare customer.\nWhich configuration supports HIPAA compliance using Anthropic-offered tools?","options":{"A":"Claude Free with no contractual addendum, since consumer products meet HIPAA requirements out of the box.","B":"Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking.","C":"Disabling all audit logging so that no PHI is recorded in any log store, on the assumption that the absence of logs satisfies HIPAA requirements without a signed BAA.","D":"An ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured."}},{"id":88,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"B,D","question":"A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles.\nWhich two metrics directly address these requirements? (Select two.)","options":{"A":"BLEU score computed against a human-annotated reference summary set","B":"Role-based access-control enforcement rate measured on a red-team dataset","C":"Throughput measured as successful requests processed per minute","D":"Per-query token cost measured against the defined cost ceiling","E":"Response latency at the 95th percentile across a one-week sample window"}},{"id":89,"domain":"practice-set-2","is_multi":true,"num_answers":2,"answer":"C,E","question":"A revenue projection assistant has missed its monthly cost target by 38%. Profiling shows: a 6,000-token policy preamble repeated on every call (45% of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30%), and inference on a flagship-tier model (25%). Stakeholders require that projection accuracy remain unchanged.\nWhich two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.)","options":{"A":"Reduce the number of historical sales chunks retrieved across each query run.","B":"Truncate the policy preamble to remove non-essential clauses from the prompt.","C":"Enable prompt caching on the static policy preamble across the recurring calls.","D":"Switch the workload to a smaller, faster Claude model tier across all queries.","E":"Cache common retrieved sales chunks accessed across many of the daily queries."}},{"id":90,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"B","question":"You are defining where human review must remain in a planned automated pipeline.\nWhich placement reflects sound human-in-the-loop design?","options":{"A":"Place a human reviewer only after the irreversible action has already executed, making the review a post-hoc audit rather than a meaningful pre-action check or approval gate.","B":"Place a human reviewer between the model's output and any high-impact, irreversible action, with explicit criteria for what the reviewer must check before approval.","C":"Place a human reviewer in the loop for a randomly selected sample of requests, without defining criteria for what the reviewer should check or which output categories require mandatory review.","D":"Remove all human review steps from the pipeline to maximize throughput, accepting that high-impact and irreversible actions will be taken without any human approval or oversight."}},{"id":91,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"B","question":"You are reviewing a peer's draft system prompt that contains contradictory instructions: one section says never to speculate beyond the supplied source, while another says to confidently fill in any gaps.\nWhich response is most appropriate?","options":{"A":"Add a priority instruction directing the model to evaluate all instructions and apply whichever appears most contextually appropriate on each request.","B":"Remove or rewrite the gap-filling instruction so the prompt consistently constrains the model to source-supported content.","C":"Increase temperature so output randomness masks the contradiction.","D":"Keep both instructions and rely on the model to decide which one to follow on each request."}},{"id":92,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"A,B","question":"A technical team is cataloging risks specific to Claude's use in a document-grounded Q&A system.\nWhich two items represent failure modes that are intrinsic to LLM-based systems rather than generic software defects? (Select two.)","options":{"A":"The model refuses a legitimate query because surface features trigger an overly broad safety pattern.","B":"The model generates a plausible-sounding answer that is unsupported by any retrieved document.","C":"An expired TLS certificate blocks outbound API calls to the Claude endpoint.","D":"A misconfigured load balancer routes requests to a deprecated API version.","E":"A database connection timeout causes a retrieval call to return an empty result set."}},{"id":93,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"C,D","question":"A technical team is cataloguing risks specific to Claude's use in a document-grounded Q&A system.\nWhich two items represent failure modes intrinsic to LLM-based systems rather than generic software defects? (Select two.) [variant]","options":{"A":"A misconfigured load balancer routes requests to a deprecated API version.","B":"A database connection timeout causes retrieval to return an empty result set.","C":"The model refuses a legitimate query because surface features trigger an overly broad safety pattern.","D":"The model generates a plausible-sounding answer unsupported by any retrieved document.","E":"An expired TLS certificate blocks outbound API calls to Claude."}},{"id":94,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"C","question":"A team manager wants all engineers working on the same repository to share identical MCP server definitions without manual synchronization.\nWhich configuration approach satisfies this requirement?","options":{"A":"managed configuration pushed to all endpoints by the administrator","B":"environment variables set at the operating-system level on each workstation","C":"project-scope .claude/settings.json and .mcp.json files committed to the repository","D":"each engineer maintains a personal ~/.claude/settings.json with the shared definitions"}},{"id":95,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"A,E","question":"An engineering organization is adopting Claude Code across 200 developers. A team lead proposes that AI-generated pull requests bypass standard code review for changes under 50 lines because small changes are considered low risk and review capacity is constrained.\nWhich two Diligence-competency objections should you raise? (Select two.)","options":{"A":"Removing review eliminates the verification mechanism required for AI-generated output across the workflow.","B":"Code-review capacity should be expanded to handle every code change submitted across the team.","C":"The threshold should be increased to 200 lines to capture more changes.","D":"AI-generated pull requests should be rejected by default across the organization.","E":"Line count is a poor proxy for the actual risk introduced by a code change."}},{"id":96,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"A,B","question":"A Claude architect is auditing configuration scope assignments.\nWhich two statements correctly identify an appropriate use of user-scope configuration versus other scopes? (Select two.)","options":{"A":"Persisting personal editor theme preferences that follow an engineer across projects.","B":"Saving a preferred Claude response language that applies to all repositories the engineer uses.","C":"Enforcing a company-wide policy that disables a feature for all engineers.","D":"Defining MCP server endpoints shared by all contributors to a specific repository.","E":"Storing API authentication keys so they are not committed to version control."}},{"id":97,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"A","question":"You are integrating Claude Code into the team's pull-request workflow. The team wants AI-assisted review without removing human approval.\nWhich integration design best fits this requirement?","options":{"A":"Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer retains the approval decision under the existing branch-protection rules.","B":"Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules.","C":"Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate.","D":"Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author."}},{"id":98,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"D,E","question":"You are reviewing instrumentation in a multi-agent system.\nWhich two findings constitute valid observability gaps in the instrumentation? (Select two.)","options":{"A":"Trace spans for each agent step are exported to the shared distributed-tracing backend.","B":"Latency and token usage on every span are emitted to the central metrics pipeline.","C":"Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields.","D":"Model identity and version on each turn are not recorded with the turn artifacts.","E":"Request-scoped correlation identifiers do not propagate across agent and tool calls."}},{"id":99,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"A,E","question":"You are designing a human-in-the-loop validation workflow for a new Claude-based deployment and must complete the design steps before piloting the workflow.\nWhich two steps must be completed BEFORE piloting the workflow with a representative subset of traffic? (Select two.)","options":{"A":"Define the sampling strategy and the escalation criteria at each oversight point in the pipeline.","B":"Iterate the workflow design based on observed pilot findings before broader rollout to production.","C":"Onboard the reviewer pool with role-specific training on the check criteria and escalation procedures.","D":"Document the workflow with check criteria, escalation paths, and service-level agreements (SLAs) for each step.","E":"Identify the decision points in the pipeline that require human oversight by impact and reversibility."}},{"id":100,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"B","question":"You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision.\nWhich presentation strategy best serves both audiences?","options":{"A":"Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs.","B":"Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience.","C":"Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it.","D":"Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."}},{"id":101,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"C,E","question":"A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline.\nWhich two diagnostic actions most directly identify the root cause of this behavior? (Select two.)","options":{"A":"Increase the context-window size to allow more retrieved chunks per query.","B":"Switch the retrieval index to a denser embedding model to improve chunk-relevance scores.","C":"Determine whether the failure reproduces on the previous model version to test for a model mismatch.","D":"Reduce the temperature setting to lower response variance across all query types.","E":"Inspect the system-prompt grounding instructions to determine whether citation constraints remain intact."}},{"id":102,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"A","question":"You are reviewing a peer's end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users.\nFor each statement, indicate Yes if it reflects sound architectural practice, otherwise No.\n(1) Authentication and authorization run before retrieval so retrieval can filter by identity.\n(2) An asynchronous queue absorbs bursty traffic between intake and the model-invocation layer.\n(3) Tax computation is encoded directly in the system prompt rather than in code.\n(4) Conversation logs include unredacted government identifiers to maximize tuning signal.","options":{"A":"Yes - Yes - No - No"}},{"id":103,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"C,D","question":"You are compiling guardrail tactics for a customer-facing assistant.\nWhich two tactics belong on the guardrail list? (Select two.)","options":{"A":"Embed approved override phrases that let trusted users relax guardrails on demand.","B":"Lower sampling temperature globally to reduce the chance of off-policy completions.","C":"Validate the model output against a structured schema before downstream actions are taken.","D":"Layer prompt-level guardrails with runtime content checks rather than relying on either alone.","E":"Rely on a single hardened system prompt that enumerates every disallowed behavior."}},{"id":104,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"A","question":"You are classifying token-management tactics by where each tactic applies in the request lifecycle: Input Preparation, Prompt Construction, or Output Handling.\n(1) Persist the validated output for downstream consumption and audit.\n(2) Order the prompt sections so cacheable content sits before per-request content.\n(3) Summarize prior conversation history when full history is no longer needed.\n(4) Validate the model's structured output against the expected schema.\n(5) Move stable repeated content into a cacheable prefix at the head of the prompt.\n(6) Trim retrieved passages to spans relevant to the user's question.","options":{"A":"Output Handling - Prompt Construction - Input Preparation - Output Handling - Prompt Construction - Input Preparation"}},{"id":105,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"A","question":"You are supporting an EU-based deployment with GDPR obligations.\nWhich combination of measures best supports the deployment's GDPR posture?","options":{"A":"enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subject-rights handling","B":"disabling all data-retention configuration, redaction controls, and data-subject-rights handling to simplify day-to-day operations, accepting the resulting GDPR compliance exposure","C":"using a personal Claude account tier for processing EU personal data at scale, with no signed Data Processing Addendum and no documented data-subject-rights handling procedure","D":"pasting full EU personal data into every prompt to 'give Claude complete context' without considering purpose limitation, data minimization, or the organization's Data Processing Addendum obligations"}},{"id":106,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"A","question":"You are selecting the documentation set that should accompany a Claude-based deployment at handoff.\nWhich set is most complete?","options":{"A":"Architecture overview, ADRs, component-level diagrams, runbooks for common operations, an on-call playbook, and a list of known limitations.","B":"Code comments scattered across individual source files with no integrating architecture overview, no ADRs, no runbooks, and no on-call playbook to orient operators or new team members.","C":"A single one-page architecture diagram with no ADRs, no runbooks, no on-call playbook, and no list of known limitations to support operators or future maintainers.","D":"A verbal handover walkthrough conducted on the day of transition, with no written architecture overview, ADRs, runbooks, playbook, or known limitations captured for future reference."}},{"id":107,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"D","question":"You are identifying signals that a deployment should re-enter design rather than continue iterating in place.\nWhich signal most directly indicates the need for a new design cycle?","options":{"A":"A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts.","B":"A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle.","C":"A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts.","D":"The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."}},{"id":108,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"B,C","question":"You are reviewing an integration specification for security gaps.\nWhich two findings constitute valid security gaps in the specification? (Select two.)","options":{"A":"Tool calls execute server-side under a least-privilege service principal scoped to the requested action.","B":"Service credentials are placed in the prompt context, where they can leak into logs and traces.","C":"Role-based access control is enforced only at the response-rendering layer after the model accesses restricted data.","D":"Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session.","E":"Tool inputs and outputs are encrypted in transit using transport-layer security between services."}},{"id":109,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"B","question":"You are defining an SLA for a Claude-based assistant.\nWhich SLA definition is most operationally meaningful?","options":{"A":"A target tied to a stakeholder sentiment measure such as 'the team feels satisfied,' which cannot be measured objectively or used to trigger a documented breach response.","B":"A measurable target with a defined metric, threshold, evaluation window, and consequence for breach-for example, 'p95 per-request latency under 800 ms over a 28-day window.'","C":"A qualitative commitment such as 'the system will be fast and reliable,' which names no metric, threshold, or evaluation window.","D":"A target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined."}},{"id":110,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"B,E","question":"You are evaluating a Claude-based deployment for adherence to a specific regulation and must complete steps before mapping deployment data flows to specific regulatory clauses.\nWhich two steps must be completed BEFORE mapping deployment data flows to specific regulatory clauses? (Select two.)","options":{"A":"Compare the in-place controls against the regulatory requirements to identify any compliance gaps.","B":"Identify the applicability of the regulation based on data types, jurisdiction, and audience.","C":"Schedule the remediation work with the engineering team based on the prioritized gap findings.","D":"Document the identified gaps along with recommended remediations and residual risk for sign-off.","E":"Inventory the vendor-provided compliance tooling and confirm which compliance affordances are in place."}},{"id":111,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"B,C","question":"You are building an ethics-review checklist for deployments supported by artificial intelligence.\nWhich two checks belong on the list? (Select two.)","options":{"A":"Confirm that vendor licensing terms permit the planned production use of the model.","B":"Verify that outputs do not rely on generalizations about people that the underlying data does not support.","C":"Confirm that high-impact decisions retain human accountability rather than being attributed to the model.","D":"Restrict ethics review to outputs that exceed a defined model-confidence threshold.","E":"Confirm that latency and throughput targets are met across supported user populations."}},{"id":112,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"D","question":"You are defining escalation criteria for ambiguous cases in an automated workflow.\nWhich set of criteria best supports consistent escalation?","options":{"A":"No escalation criteria; the model decides independently on every turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags.","B":"Escalation only after an affected customer has contacted support to complain, after the automated workflow has already completed without human review.","C":"Escalation at the discretion of whoever is available when the team's on-call engineer has spare capacity, without a defined threshold, category, or ambiguity criterion.","D":"A confidence score below a defined threshold, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user's explicit request for review."}},{"id":113,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"C","question":"You are transitioning a Claude-based deployment from design into implementation.\nWhich handoff package most directly supports a clean transition?","options":{"A":"The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register.","B":"A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRs, component contracts, evaluation framework, runbooks, playbook, or known limitations.","C":"Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on-call playbook, and known limitations.","D":"Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation framework, runbooks, on-call playbook, or known-limitations register to support the delivery team."}},{"id":114,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"B","question":"You are designing the prompt for a ticket-triage classifier with thirty well-defined categories and clear category descriptions in the prompt.\nWhich technique is most appropriate as the starting point?","options":{"A":"A chain-of-thought prompt for a routing decision that does not require multi-step reasoning.","B":"A zero-shot prompt that specifies the categories with their descriptions and the required output format.","C":"A prompt that demands the model invent new categories when the supplied ones do not fit.","D":"A prompt with no category descriptions, expecting the model to infer the category set."}},{"id":115,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"C,E","question":"A technical team is cataloguing risks specific to Claude's use in a document-grounded Q&A system.\nWhich two items represent failure modes intrinsic to LLM-based systems rather than generic software defects? (Select two.) [variant 2]","options":{"A":"An expired TLS certificate blocks outbound API calls to Claude.","B":"A database connection timeout causes retrieval to return an empty result set.","C":"The model refuses a legitimate query because surface features trigger an overly broad safety pattern.","D":"A misconfigured load balancer routes requests to a deprecated API version.","E":"The model generates a plausible-sounding answer unsupported by any retrieved document."}},{"id":116,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"C,E","question":"You are compiling a diagnostic toolkit for Claude Code operational issues.\nWhich two diagnostic actions belong in the toolkit? (Select two.)","options":{"A":"Increase the model sampling temperature so that intermittent issues surface more frequently for analysis.","B":"File a support ticket with vendor support before any local reproduction or evidence collection.","C":"Reproduce the issue with a minimal reproduction case that isolates one variable at a time.","D":"Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific.","E":"List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures."}},{"id":117,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"B,E","question":"A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations.\nWhich two guardrail implementations most directly enforce this constraint? (Select two.)","options":{"A":"Increase response temperature to introduce variability that reduces the likelihood of specific recommendations.","B":"Add an output classifier that detects and blocks responses containing regulated investment-recommendation language.","C":"Limit session length to reduce the volume of queries processed per user per day.","D":"Log all user queries to a SIEM for post-hoc compliance review.","E":"Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests."}},{"id":118,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"B","question":"A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query. The CFO wants to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside Fabrikam's tenancy.\nWhich optimization approach should you recommend?","options":{"A":"Summarize each filing once at intake and run all subsequent queries against the summary.","B":"Cache the filing as the prompt prefix for reuse across the 14 queries per case.","C":"Index filings in a vector store and retrieve only the relevant passages per query.","D":"Move the workload to a smaller Claude model to reduce the per-token cost paid."}},{"id":119,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"C","question":"You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session.\nWhich diagnostic step should be tried first?","options":{"A":"Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered.","B":"Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue.","C":"Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect.","D":"Reinstall the developer's operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps."}},{"id":120,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"B","question":"After a prompt-template update, several previously passing test cases now produce unexpected outputs.\nWhich test type is specifically designed to detect this category of failure?","options":{"A":"Adversarial tests that probe for prompt-injection vulnerabilities.","B":"Regression tests scored against a stable reference set of known-good behavior.","C":"Smoke tests that confirm high-level system availability after the change.","D":"Integration tests that validate cross-component pipeline behavior."}},{"id":121,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"A","question":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response.\nWhich design pattern best addresses this issue without sacrificing capability breadth?","options":{"A":"Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.","B":"Use a separate model call to summarize all 60 tool definitions before each user turn.","C":"Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability.","D":"Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task."}},{"id":122,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"C","question":"You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers.\nWhich response is most appropriate?","options":{"A":"Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency.","B":"Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add configuration complexity, accepting the full attack surface for all engineers across all projects.","C":"Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations.","D":"Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations."}},{"id":123,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"B","question":"You are running a discovery session with a business sponsor who asks for 'an AI system to fix our customer escalations.'\nWhich approach best yields actionable requirements?","options":{"A":"Accept the sponsor's original phrasing as a complete and final requirement and proceed directly to design without asking targeted questions to surface actors, triggers, or constraints.","B":"Decompose the request by asking targeted questions about who escalates, what triggers escalation, what good resolution looks like, and which constraints-latency, cost, audit, and data sensitivity-apply.","C":"Defer the discovery session indefinitely on the grounds that the sponsor must fully specify the system before the architect can ask any clarifying or scoping questions.","D":"Assume the requirement matches the architect's previous engagement in a different industry and proceed with that context, without validating actors, triggers, or constraints for this sponsor."}},{"id":124,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"A","question":"A solutions architect is analyzing stakeholder feedback after the first quarter of a Claude-powered procurement automation deployment.\nStatements: (1) 'Our procurement team is processing 3x more purchase orders per analyst per day.' (2) 'We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.' (3) 'The API integration costs are running 40% over the projected per-transaction budget.' (4) 'Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.'\nWhich correctly identifies the primary business value pillar each statement represents?","options":{"A":"Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA","B":"Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4: Performance SLA","C":"Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4: Efficiency","D":"Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4: Solution Cost"}},{"id":125,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"D","question":"A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing. The team spends approximately 40% of engineering capacity on infrastructure maintenance. The security officer requires that all customer financial data remain within an approved network boundary.\nWhich factor should most heavily influence your recommendation?","options":{"A":"Whether the current seven agents map cleanly to the patterns supported by managed agents.","B":"Whether managed agents reduce per-invoice token costs across the existing processing volume.","C":"Whether managed agents support the current bus topology used by the platform team.","D":"Whether managed agent data handling satisfies the network boundary required by security."}},{"id":126,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"A,B","question":"A loan pre-qualification assistant shows 94% approval recommendations that match the human underwriter decision. The fairness team reviewed approval rate parity across protected groups and reported no significant difference. A board member asked whether this evidence is sufficient to declare the assistant fair.\nWhich two Discernment-competency findings should you report? (Select two.)","options":{"A":"Approval rate parity does not by itself assess error rate parity across protected groups.","B":"Match with human underwriters does not establish freedom from underwriter-introduced bias.","C":"The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions.","D":"The fairness team's review process likely missed at least some of the protected groups studied.","E":"A larger sample is needed before any meaningful fairness claim can be made about the model."}},{"id":127,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"C","question":"You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed.\nWhich resolution step is most appropriate?","options":{"A":"Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional.","B":"Disable the permission system entirely across all scopes to remove the denial, eliminating all tool-pattern and deny-rule controls rather than identifying and amending the specific rule.","C":"Inspect the active permission rules across all scopes-managed, command-line, local, project, and user-to identify which rule is denying the action and confirm whether it should be amended or remain denied.","D":"Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in question."}},{"id":128,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"B","question":"A senior architect is preparing briefing materials on a new retrieval architecture. The executive sponsor has requested a summary of the architectural decision.\nWhich framing is most appropriate for that audience?","options":{"A":"Technical alternatives evaluated, implementation implications, and component-level consequences.","B":"Business outcomes achieved, trade-offs accepted, and high-level risks acknowledged.","C":"Capabilities delivered, scope implications, and feature-level dependencies on the roadmap.","D":"Threat model, control mappings, residual-risk acceptance, and audit traceability."}},{"id":129,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"B","question":"You are comparing two configurations for an internal compliance Q&A assistant. Configuration X reduces top-k retrieval and uses a lighter model, lowering p95 latency by 38% while producing a measured 2% reduction in the accuracy benchmark. Configuration Y retains the existing top-k retrieval setting and heavier model, with unchanged p95 latency and no measurable change in accuracy. The deployment's stated priorities are accuracy first and latency second.\nWhich configuration is the better recommendation?","options":{"A":"Configuration X, because the 2 percent accuracy reduction falls within normal benchmark variance and is not a meaningful regression.","B":"Configuration Y, because the deployment's stated priority is accuracy first, and Configuration X produces a measured reduction in accuracy.","C":"Configuration X, because lower latency generally matters more than accuracy, regardless of the deployment's stated priorities.","D":"Configuration X, because a 38 percent latency improvement outweighs a 2 percent accuracy reduction as a general rule across compliance deployments."}}];

const state = {};
questions.forEach(q => { state[q.id] = { selected: new Set(), answered: false, correct: false }; });

let filtered = [...questions];

function domainLabel(d) { return d.replace('practice-set-', 'PS '); }

function getStatus(q) {
  const s = state[q.id];
  if (!s.answered) return 'pending';
  return s.correct ? 'correct' : 'wrong';
}

function updateStats() {
  let correct = 0, wrong = 0, pending = 0;
  questions.forEach(q => {
    const st = getStatus(q);
    if (st === 'correct') correct++;
    else if (st === 'wrong') wrong++;
    else pending++;
  });
  const answered = correct + wrong;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
  document.getElementById('cnt-pending').textContent = pending;
  document.getElementById('cnt-total').textContent = questions.length;
  document.getElementById('score-badge').textContent = `${correct} / ${answered || 0}`;
  document.getElementById('progress-bar').style.width = `${(answered / questions.length * 100).toFixed(1)}%`;
}

function checkAnswer(qid) {
  const q = questions.find(x => x.id === qid);
  const s = state[qid];
  const correctSet = new Set(q.answer.split(','));
  const isCorrect = s.selected.size === correctSet.size && [...s.selected].every(k => correctSet.has(k));
  s.answered = true;
  s.correct = isCorrect;

  const card = document.getElementById(`card-${qid}`);
  card.classList.remove('answered-correct', 'answered-wrong');
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // Update result tag
  const tagResult = card.querySelector('.tag-result');
  if (tagResult) {
    tagResult.className = `tag ${isCorrect ? 'tag-result-ok' : 'tag-result-fail'}`;
    tagResult.textContent = isCorrect ? '✓ Correct' : '✗ Wrong';
  }

  // Style options
  card.querySelectorAll('.option').forEach(el => {
    const key = el.dataset.key;
    el.classList.add('disabled');
    el.classList.remove('selected');
    if (correctSet.has(key)) {
      el.classList.add('correct');
      el.querySelector('.opt-icon').textContent = '✓';
    } else if (s.selected.has(key)) {
      el.classList.add('wrong');
      el.querySelector('.opt-icon').textContent = '✗';
    }
  });

  // Hide check button if present
  const btn = card.querySelector('.check-btn');
  if (btn) btn.style.display = 'none';

  // Show explanation
  const exp = card.querySelector('.explanation');
  if (exp) {
    exp.style.display = 'block';
    exp.className = `explanation ${isCorrect ? 'correct' : 'wrong'}`;
    const hint = hints[qid] ? `<div class="hint-text">💡 ${hints[qid]}</div>` : '';
    exp.innerHTML = (isCorrect
      ? `<strong>✓ Correct!</strong> Answer: <strong>${q.answer}</strong>`
      : `<strong>✗ Incorrect.</strong> Correct answer: <strong>${q.answer}</strong>`) + hint;
  }

  updateStats();
  // Re-filter if status filter active
  if (document.getElementById('statusFilter').value) applyFilters(true);
}

function handleOptionClick(qid, key) {
  const q = questions.find(x => x.id === qid);
  const s = state[qid];
  if (s.answered) return;

  if (!q.is_multi) {
    // Single: select and immediately check
    s.selected.clear();
    s.selected.add(key);
    // Highlight selection briefly then check
    const card = document.getElementById(`card-${qid}`);
    card.querySelectorAll('.option').forEach(el => {
      el.classList.toggle('selected', el.dataset.key === key);
    });
    checkAnswer(qid);
  } else {
    // Multi: toggle selection
    if (s.selected.has(key)) s.selected.delete(key);
    else s.selected.add(key);
    const card = document.getElementById(`card-${qid}`);
    card.querySelectorAll('.option').forEach(el => {
      el.classList.toggle('selected', s.selected.has(el.dataset.key));
    });
    // Enable/disable check button
    const btn = card.querySelector('.check-btn');
    if (btn) btn.disabled = s.selected.size < q.num_answers;
  }
}

function renderCard(q) {
  const s = state[q.id];
  const answered = s.answered;
  const correctSet = new Set(q.answer.split(','));

  const cardClass = ['card',
    q.is_multi ? 'multi' : '',
    answered ? (s.correct ? 'answered-correct' : 'answered-wrong') : ''
  ].filter(Boolean).join(' ');

  const resultTag = answered
    ? `<span class="tag tag-result ${s.correct ? 'tag-result-ok' : 'tag-result-fail'}">${s.correct ? '✓ Correct' : '✗ Wrong'}</span>`
    : `<span class="tag tag-result"></span>`;

  const opts = Object.entries(q.options).map(([k, v]) => {
    let cls = 'option';
    let icon = '';
    if (answered) {
      cls += ' disabled';
      if (correctSet.has(k)) { cls += ' correct'; icon = '✓'; }
      else if (s.selected.has(k)) { cls += ' wrong'; icon = '✗'; }
    } else if (s.selected.has(k)) {
      cls += ' selected';
    }
    return `<div class="${cls}" data-key="${k}" onclick="handleOptionClick(${q.id},'${k}')">
      <span class="opt-key">${k}.</span><span>${v}</span><span class="opt-icon">${icon}</span>
    </div>`;
  }).join('');

  const checkBtn = q.is_multi && !answered
    ? `<button class="check-btn" disabled onclick="checkAnswer(${q.id})">Check (${q.num_answers} answers)</button>`
    : '';

  const hintHtml = hints[q.id] ? `<div class="hint-text">💡 ${hints[q.id]}</div>` : '';
  const expText = answered
    ? `<div class="explanation ${s.correct ? 'correct' : 'wrong'}" style="display:block">
        ${s.correct ? `<strong>✓ Correct!</strong> Answer: <strong>${q.answer}</strong>` : `<strong>✗ Incorrect.</strong> Correct answer: <strong>${q.answer}</strong>`}
        ${hintHtml}
       </div>`
    : `<div class="explanation"></div>`;

  return `<div class="${cardClass}" id="card-${q.id}">
    <div class="card-header">
      <span class="q-num">Question ${q.id}</span>
      <span class="tags">
        <span class="tag tag-domain">${domainLabel(q.domain)}</span>
        ${q.is_multi ? `<span class="tag tag-multi">Select ${q.num_answers}</span>` : ''}
        ${resultTag}
      </span>
    </div>
    <div class="question-text">${q.question}</div>
    <div class="options">${opts}</div>
    ${checkBtn}
    ${expText}
  </div>`;
}

function applyFilters(preserve_scroll) {
  const search = document.getElementById('search').value.toLowerCase();
  const domain = document.getElementById('domainFilter').value;
  const type = document.getElementById('typeFilter').value;
  const status = document.getElementById('statusFilter').value;

  filtered = questions.filter(q => {
    if (domain && q.domain !== domain) return false;
    if (type === 'single' && q.is_multi) return false;
    if (type === 'multi' && !q.is_multi) return false;
    if (status === 'pending' && getStatus(q) !== 'pending') return false;
    if (status === 'correct' && getStatus(q) !== 'correct') return false;
    if (status === 'wrong' && getStatus(q) !== 'wrong') return false;
    if (search) {
      const text = (q.question + ' ' + Object.values(q.options).join(' ')).toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });

  const container = document.getElementById('question-list');
  const noResults = document.getElementById('no-results');
  if (filtered.length === 0) { container.innerHTML = ''; noResults.style.display = 'block'; return; }
  noResults.style.display = 'none';
  container.innerHTML = filtered.map(renderCard).join('');
}

function resetAll() {
  if (!confirm('Restart everything? Your progress will be erased.')) return;
  questions.forEach(q => { state[q.id] = { selected: new Set(), answered: false, correct: false }; });
  updateStats();
  applyFilters();
}

// Scroll to top button
window.addEventListener('scroll', () => {
  document.getElementById('to-top').classList.toggle('show', window.scrollY > 400);
});

// Init
updateStats();
applyFilters();
</script>
