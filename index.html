<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCAR-P – Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f8; color: #1a1a2e; }

  /* HEADER */
  header { background: #1a1a2e; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  header h1 { font-size: 1.15rem; flex: 1; letter-spacing: .5px; }
  .score-badge { background: #16a34a; color: #fff; border-radius: 20px; padding: 4px 14px; font-size: 0.85rem; font-weight: 700; white-space: nowrap; }

  /* CONTROLS */
  .controls { background: #fff; border-bottom: 1px solid #dde1f0; padding: 10px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .controls input { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid #c8cde8; border-radius: 8px; font-size: 0.9rem; outline: none; }
  .controls input:focus { border-color: #4f46e5; }
  .controls select { padding: 8px 10px; border: 1px solid #c8cde8; border-radius: 8px; font-size: 0.9rem; outline: none; background: #fff; }
  .btn-reset { padding: 8px 16px; border: none; border-radius: 8px; background: #e94560; color: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-reset:hover { background: #c73652; }

  /* STATS BAR */
  .stats { padding: 7px 20px; font-size: 0.82rem; color: #555; background: #f8f9fe; border-bottom: 1px solid #e8eaf4; display: flex; gap: 16px; flex-wrap: wrap; }
  .stat-item { display: flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot-correct { background: #16a34a; }
  .dot-wrong { background: #dc2626; }
  .dot-pending { background: #9ca3af; }

  /* QUESTION LIST */
  .question-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; max-width: 860px; margin: 0 auto; }

  /* CARD */
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07); padding: 20px 22px; border-left: 4px solid #c8cde8; transition: border-color .2s; }
  .card.answered-correct { border-left-color: #16a34a; }
  .card.answered-wrong { border-left-color: #dc2626; }
  .card.multi { border-left-color: #7c3aed; }
  .card.multi.answered-correct { border-left-color: #16a34a; }
  .card.multi.answered-wrong { border-left-color: #dc2626; }

  /* CARD HEADER */
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
  .q-num { font-weight: 700; color: #1a1a2e; font-size: 0.88rem; white-space: nowrap; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .tag-domain { background: #eef0ff; color: #3730a3; }
  .tag-multi { background: #f5f0ff; color: #7c3aed; }
  .tag-result-ok { background: #f0fdf4; color: #16a34a; font-weight: 700; }
  .tag-result-fail { background: #fef2f2; color: #dc2626; font-weight: 700; }

  /* QUESTION TEXT */
  .question-text { font-size: 0.92rem; line-height: 1.65; margin-bottom: 14px; white-space: pre-wrap; color: #1a1a2e; }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; gap: 10px; padding: 10px 14px;
    border-radius: 8px; font-size: 0.88rem; line-height: 1.5;
    cursor: pointer; border: 2px solid #e8eaf4;
    transition: all .15s; user-select: none; background: #fafbff;
  }
  .option:hover:not(.disabled) { border-color: #4f46e5; background: #f0f1ff; }
  .option.selected { border-color: #4f46e5; background: #eef0ff; }
  .option.correct { border-color: #16a34a; background: #f0fdf4; }
  .option.correct .opt-key { color: #16a34a; }
  .option.wrong { border-color: #dc2626; background: #fef2f2; }
  .option.wrong .opt-key { color: #dc2626; }
  .option.disabled { cursor: default; }
  .opt-key { font-weight: 700; color: #4f46e5; min-width: 22px; flex-shrink: 0; }
  .opt-icon { margin-left: auto; flex-shrink: 0; font-size: 1rem; }

  /* CHECK BUTTON (multi) */
  .check-btn {
    margin-top: 12px; padding: 9px 20px; border: none; border-radius: 8px;
    background: #4f46e5; color: #fff; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .check-btn:hover:not(:disabled) { background: #3730a3; }
  .check-btn:disabled { background: #c8cde8; cursor: default; }

  /* EXPLANATION */
  .explanation { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; line-height: 1.6; display: none; }
  .explanation.correct { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .explanation.wrong { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .hint-text { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.08); color: #374151; font-size: 0.83rem; line-height: 1.65; }

  /* EMPTY */
  #no-results { text-align: center; color: #888; padding: 48px 20px; display: none; font-size: 0.95rem; }

  /* PROGRESS BAR */
  .progress-wrap { height: 4px; background: #e8eaf4; }
  .progress-bar { height: 4px; background: linear-gradient(90deg,#4f46e5,#16a34a); transition: width .3s; }

  /* SCROLL TOP */
  .to-top { position: fixed; bottom: 20px; right: 20px; background: #1a1a2e; color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.2); display: none; align-items: center; justify-content: center; z-index: 200; }
  .to-top.show { display: flex; }
</style>
</head>
<body>

<header>
  <h1>CCAR-P · Review</h1>
  <span class="score-badge" id="score-badge">0 / 0</span>
</header>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 Search questions..." oninput="applyFilters()">
  <select id="domainFilter" onchange="applyFilters()">
    <option value="">All Practice Sets</option>
    <option value="practice-set-1">Practice Set 1</option>
    <option value="practice-set-2">Practice Set 2</option>
    <option value="practice-set-3">Practice Set 3</option>
    <option value="practice-set-4">Practice Set 4</option>
    <option value="practice-set-5">Practice Set 5</option>
    <option value="practice-set-6">Practice Set 6</option>
  </select>
  <select id="typeFilter" onchange="applyFilters()">
    <option value="">All types</option>
    <option value="single">Single answer</option>
    <option value="multi">Multiple answers</option>
  </select>
  <select id="statusFilter" onchange="applyFilters()">
    <option value="">All statuses</option>
    <option value="pending">Unanswered</option>
    <option value="correct">Correct</option>
    <option value="wrong">Wrong</option>
  </select>
  <button class="btn-reset" onclick="resetAll()">↺ Restart</button>
</div>

<div class="stats" id="stats-bar">
  <span class="stat-item"><span class="dot dot-pending"></span> Unanswered: <strong id="cnt-pending">0</strong></span>
  <span class="stat-item"><span class="dot dot-correct"></span> Correct: <strong id="cnt-correct">0</strong></span>
  <span class="stat-item"><span class="dot dot-wrong"></span> Wrong: <strong id="cnt-wrong">0</strong></span>
  <span class="stat-item">Total: <strong id="cnt-total">0</strong></span>
</div>

<div class="question-list" id="question-list"></div>
<div id="no-results">No matching questions found.</div>

<button class="to-top" id="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const questions = [{"id":1,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"C","question":"You are reviewing a customer-support agent's configuration. Each candidate tool falls into one of four categories: (1) required to complete defined tasks, (2) frequently used and reduces hand-offs, (3) occasionally useful for unrelated work, (4) speculative future utility.\nWhich categories should typically remain in the agent configuration?","options":{"A":"Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks.","B":"Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them.","C":"Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs.","D":"All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs."}},{"id":2,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"A","question":"You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an internal pricing service that already exposes a stable HTTP API.\nWhich integration mechanism is the most appropriate?","options":{"A":"A direct API call to the existing endpoint with the appropriate scoped credentials.","B":"A long-lived stateful session protocol for a stateless single-call interaction.","C":"A bespoke streaming protocol layered over an unrelated asynchronous message bus.","D":"An agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service."}},{"id":3,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"D","question":"A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal-document summarization system. Observations: (1) Average summarization time decreased from 47 minutes to 6 minutes per document. (2) Associates spend less time on summaries, but overall billable output has not measurably changed. (3) Infrastructure costs increased by 22% because redundant retry logic generated additional API calls. (4) Some summaries require attorney correction, adding an average of 8 minutes of review per document.\nWhich analysis correctly attributes each observation to the appropriate business-value pillar?","options":{"A":"Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue.","B":"Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue.","C":"Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering.","D":"Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized; Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."}},{"id":4,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"C","question":"You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document retrieval and outbound HTTP calls.\nWhich scenario most directly indicates a data-exfiltration risk?","options":{"A":"The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request.","B":"The user submits a routine question and receives a routine answer.","C":"Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL.","D":"The internal-document retrieval tool returns a document that the user is authorized to view."}},{"id":5,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"A,B","question":"An architect is reviewing a set of architecture documentation packages before handing off a Claude-based pipeline to an implementation team.\nWhich two characteristics indicate that a documentation package is sufficient to support implementation without ongoing architect involvement? (Select two.)","options":{"A":"The document specifies integration contracts, configuration schemas, and expected input/output shapes for each component.","B":"The document includes a decision log that records the rationale for key architectural choices and the alternatives rejected.","C":"The document provides a high-level narrative description of the business problem without component-level detail.","D":"The document includes the architect's contact information for questions arising during implementation.","E":"The document lists all Claude models that were evaluated but does not specify which was selected or why."}},{"id":6,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"D","question":"You are integrating Claude Code into a workflow that runs against a production database.\nWhich guardrail design most directly preserves safety on data-modifying operations?","options":{"A":"Allow Claude Code to write directly to the production database without subagent scoping, read-only credential defaults, or human confirmation gates on data-modifying operations.","B":"Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation.","C":"Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications.","D":"Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data."}},{"id":7,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"C,E","question":"You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps before assessing threats against assets.\nWhich two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact? (Select two.)","options":{"A":"Document the assessment outcome with risks, mitigations, residual risk, and acceptance owners.","B":"Recommend mitigations and residual-risk acceptance for the risks that remain after analysis.","C":"Identify the assets that the deployment touches, along with the sensitivity of each asset.","D":"Recommend mitigations and residual-risk acceptance for risks that remain.","E":"Enumerate the threat actors and attack vectors relevant to the deployment."}},{"id":8,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"B","question":"You are preparing an operational runbook for a Claude-based service.\nWhich content is essential to include in the runbook?","options":{"A":"Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on.","B":"Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs.","C":"Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use.","D":"Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response."}},{"id":9,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"A","question":"You are evaluating model-selection claims used by a peer team.\nFor each statement, select Yes if generally true, otherwise No.\n(1) Heavier-reasoning models typically consume more of the rate limit and run more slowly than lighter models on the same input.\n(2) A representative-sample evaluation on the target workload is the right basis for confirming a model selection.\n(3) The most capable model is always the right choice regardless of the workload profile.\n(4) Tiered routing can serve routine traffic with a lighter model while reserving a heavier model for traffic that needs its capability.\n(5) Selecting a model based on which version was most recently announced is the right basis for production decisions.","options":{"A":"Yes - Yes - No - Yes - No"}},{"id":10,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"C","question":"You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code.\nWhich integration approach best fits this requirement?","options":{"A":"Generate documentation from the model's training-data recall without reading any of the actual repository code, accepting that the output will not reflect the current implementation.","B":"Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step.","C":"Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.","D":"Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that documentation generation will be entirely disconnected from the actual implementation."}},{"id":11,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"C","question":"A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X: higher output quality scores, costs $0.18/session, averages 4.2s response. Architecture Y: slightly lower quality, costs $0.09/session, averages 2.1s response. SLA requires responses under 3 seconds. Annual volume: 2 million documentation sessions.\nWhich evaluation approach correctly applies business value pillar analysis to this decision?","options":{"A":"Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments.","B":"Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment.","C":"Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity.","D":"Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most."}},{"id":12,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"C,D","question":"A Claude architect is designing a HIPAA-compliant pipeline that processes patient records.\nWhich two design decisions directly support HIPAA compliance requirements? (Select two.)","options":{"A":"Setting max_tokens to a low value to minimize the volume of text generated per request.","B":"Selecting the highest-capability Claude model to maximize diagnostic accuracy.","C":"Enforcing role-based access controls so that PHI is retrievable only by authorized personnel.","D":"Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place.","E":"Using streaming responses to reduce perceived latency for clinical users."}},{"id":13,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"D,E","question":"You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API integration, and agent-to-agent handoff.\nWhich two factors belong on the list? (Select two.)","options":{"A":"Whether the vendor publishes detailed reference documentation for each candidate protocol.","B":"Whether the team has prior implementation experience with any of the candidate protocols.","C":"Whether the underlying transport supports encryption in transit between the integrated services.","D":"Whether the integration must be portable across multiple AI clients in the ecosystem.","E":"Whether the interaction is stateless and latency-sensitive or stateful and longer-running."}},{"id":14,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"A,B","question":"A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months. Triage accuracy declined from 91% to 78%, and average tool-selection latency increased by 2.3 seconds. A junior engineer proposed adding a tool-router agent.\nWhich two findings should you present to justify capability decomposition before adding the router? (Select two.)","options":{"A":"Tool descriptions overlap across multiple claim categories within the agent's tool set.","B":"Several tools have not been invoked across the most recent 90 days of traffic.","C":"The 34 tools serve four distinct claim-workflow domains within the triage scope.","D":"The router pattern is well documented across publicly available agent literature.","E":"The proposed router introduces an additional model call on every incoming request."}},{"id":15,"domain":"practice-set-6","is_multi":true,"num_answers":2,"answer":"B,D","question":"You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset.\nWhich two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.)","options":{"A":"Publish the aggregated metrics to a dashboard and gate releases on threshold checks.","B":"Curate and label the evaluation dataset to match the defined slices.","C":"Review failure cases with subject matter experts to refine the scoring rubric.","D":"Define the metrics and slices the framework will report across representative, edge, and adversarial cases.","E":"Score the deployment outputs against the reference labels and aggregate the metrics."}},{"id":16,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"A","question":"You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities.\nWhich scenario most directly justifies a dedicated subagent?","options":{"A":"The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions.","B":"The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection.","C":"The team has no recurring specialized tasks and uses Claude Code only for isolated general-purpose work that does not justify a dedicated system prompt or tool scope.","D":"The team wants every Claude Code interaction to use the same generic system prompt with no task-specific specialization, narrow tool permissions, or dedicated model selection."}},{"id":17,"domain":"practice-set-4","is_multi":true,"num_answers":2,"answer":"D,E","question":"You are building a feedback-and-alignment routine for a multi-stakeholder deployment.\nWhich two practices belong in the routine? (Select two.)","options":{"A":"Record each session and distribute the recording to stakeholders who could not attend live.","B":"Escalate any disagreement among stakeholders to the executive sponsor for binding resolution.","C":"Rotate facilitation among the participating stakeholder groups to share ownership of the routine.","D":"Set a regular cadence for revisiting expectations and assumptions as conditions evolve over time.","E":"Reconcile divergent stakeholder positions explicitly rather than papering over them in the moment."}},{"id":18,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"A","question":"You are selecting a pattern for a compliance Q&A assistant that must answer policy questions with citations to the authoritative internal source set. Latency, cost, and audit predictability are prioritized.\nWhich pattern is the best fit?","options":{"A":"Augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer.","B":"Multi-agent orchestration with a planner, researcher, and writer agent for every query.","C":"A pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus.","D":"A static prompt with the entire policy corpus concatenated into every request."}},{"id":19,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"A","question":"You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins.\nWhich adjustment most directly addresses this issue without removing capability?","options":{"A":"Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront.","B":"Disable every MCP server in the configuration to free up context budget, accepting that the team loses all tool access and cannot perform any MCP-dependent task in the session.","C":"Increase the prompt's verbosity with additional instructions and context, which consumes more of the context budget rather than reducing the tool-definition overhead causing the issue.","D":"Add additional MCP servers to give the team more capability, which increases rather than reduces the number of tool definitions loaded into the session's context budget."}},{"id":20,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"B","question":"You are operating an interactive assistant whose dominant performance constraint is per-turn latency. Quality on routine turns is already acceptable.\nWhich configuration adjustment most directly improves latency without disproportionately damaging quality?","options":{"A":"Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions.","B":"Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system-prompt content.","C":"Increase retrieval depth to the corpus maximum to improve recall regardless of latency.","D":"Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it."}},{"id":21,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"C","question":"You are responding to a stakeholder request that adds significant scope to a deployment already in flight.\nWhich response best aligns expectations while respecting the stakeholder's underlying need?","options":{"A":"Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications.","B":"Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension.","C":"Acknowledge the request, describe the scope and timeline implications transparently, and propose options-defer it, descope something else, or extend the timeline-for the stakeholder to choose.","D":"Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays."}},{"id":22,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"B","question":"You are designing a feedback session for a deployment in flight.\nWhich structure best supports productive stakeholder feedback?","options":{"A":"Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward.","B":"Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates.","C":"Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real time without preparation before the discussion begins.","D":"End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward."}},{"id":23,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"A,B","question":"The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries with required disclaimers and prohibited-language list. A product manager asked whether additional guardrails are needed at the application layer.\nWhich two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.)","options":{"A":"Log every generated summary to the firm's compliance audit trail for retention.","B":"Verify the requesting user is authorized to generate investment summaries at all.","C":"Format output sections according to the firm's standardized house style guidelines.","D":"Apply the disclaimer template that the compliance team has standardized firm-wide.","E":"Apply the prohibited-language list that the compliance team maintains and updates."}},{"id":24,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"C","question":"A Claude architect needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is set.\nWhich configuration scope correctly enforces this requirement?","options":{"A":"User scope (~/.claude/settings.json) on each engineer's machine","B":"Environment variable defined in the CI/CD pipeline only","C":"Managed configuration applied centrally and marked as non-overridable","D":"Project scope (.claude/settings.json) committed to the repository"}},{"id":25,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"C","question":"You are configuring Claude Code for a team that needs every engineer to share the same MCP server set, permission rules, and project context across the engineering monorepo.\nWhich configuration scope best supports this requirement?","options":{"A":"User scope, with the MCP server definitions and permission rules placed in each engineer's ~/.claude/settings.json and synchronized manually through a shared setup script outside version control.","B":"Local scope configured only on the lead architect's machine, with no configuration present on other engineers' machines and no mechanism to distribute MCP servers or permission rules.","C":"Project scope, with the configuration committed to the repository so every engineer working in the project receives the same MCP servers, permissions, and context.","D":"User scope configured individually on each engineer's machine, with no shared configuration committed to the repository and no guarantee of consistency across the team."}},{"id":26,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"C","question":"An engineer inadvertently commits an API key to the repository by placing it in .claude/settings.json.\nWhich configuration design principle was violated?","options":{"A":"Project-scope configuration should always override user-scope configuration.","B":"Managed configuration must be applied before project-scope configuration is read.","C":"Credentials must be resolved at runtime from a secret store and never stored in version-controlled files.","D":"MCP server definitions must reside in environment variables to prevent scope conflicts."}},{"id":27,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"A","question":"During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior.\nWhich mitigation most directly addresses this threat?","options":{"A":"Treat all retrieved content as untrusted input and apply input classifiers with output validation.","B":"Require citations for each claim and constrain responses to source-supported content.","C":"Restrict outbound tool calls to an approved destination allow-list.","D":"Score outputs against a stable adversarial evaluation set on each model-version change."}},{"id":28,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"A,E","question":"A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency.\nWhich two actions most directly address stakeholder expectation alignment in this situation? (Select two.)","options":{"A":"Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data.","B":"Pause all development and reallocate engineering resources entirely to latency optimization.","C":"Communicate that latency concerns are a known LLM limitation and outside the architecture team's control.","D":"Replace the current Claude model with a third-party model that may offer lower latency without evaluation.","E":"Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints."}},{"id":29,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"C,D","question":"You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models empirically.\nWhich two steps must be completed BEFORE running a representative sample on a candidate model? (Select two.)","options":{"A":"Select the lightest model that consistently meets the quality bar across the sample.","B":"Retest the model choice when a new model version becomes available.","C":"Choose a candidate model based on the requirements profile and known capabilities.","D":"Define the quality bar, latency tolerance, and expected volume for the workload.","E":"Sign off the production rollout plan with the platform and security teams."}},{"id":30,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"D","question":"You are distinguishing functional from non-functional requirements during discovery.\nWhich item is a non-functional requirement?","options":{"A":"The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record.","B":"The system must produce a draft response that a human reviewer can edit before sending.","C":"The system must classify inbound tickets into a defined set of categories.","D":"The system must respond at p95 latency under 800 milliseconds at the expected request volume."}},{"id":31,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"B","question":"You are responding to an adversarial input pattern in which users include text claiming admin authority and instructing the model to bypass safety restrictions.\nWhich combination of controls most effectively mitigates this attack pattern?","options":{"A":"Trusting that the model will intrinsically recognize and reject all bypass attempts without prompt-level instructions, runtime classifiers, scoped permissions, or audit logging.","B":"Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts.","C":"Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs.","D":"Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification."}},{"id":32,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"B","question":"You are designing a content moderation classifier that processes high volumes of user-generated comments under a tight per-message latency budget using well-defined classification labels.\nWhich model selection best aligns with the workload?","options":{"A":"Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity.","B":"Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth.","C":"Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict.","D":"Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling."}},{"id":33,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"B,E","question":"You are running a discovery engagement for a new Claude-based capability and must complete the requirements-gathering steps before validating with stakeholders.\nWhich two steps must be completed BEFORE validating the captured requirements with stakeholders? (Select two.)","options":{"A":"Produce architecture decision records that capture the rationale for major design choices.","B":"Capture the business goals, success criteria, and the in-scope user population for the engagement.","C":"Document the consolidated requirements with traceability to the source stakeholder for each item.","D":"Schedule the rollout milestones and dependencies with engineering and product partners.","E":"Identify the non-functional constraints covering latency, cost, audit, data sensitivity, and regulatory needs."}},{"id":34,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"A","question":"You are evaluating retrieval-strategy claims used by a peer team.\nFor each claim, select Yes if generally accurate, otherwise No.\n(1) Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text.\n(2) Sparse term-matching retrieval recovers exact terms more reliably than dense alone.\n(3) Structured query retrieval is the right fit for filter-and-aggregate workloads against a relational store.\n(4) Hybrid retrieval is identical to dense-only retrieval.\n(5) Random sampling is a sound retrieval strategy for production Q&A.","options":{"A":"Yes - Yes - Yes - No - No"}},{"id":35,"domain":"practice-set-6","is_multi":true,"num_answers":2,"answer":"B,D","question":"You are compiling continuity practices that span the deployment lifecycle.\nWhich two practices belong on the list? (Select two.)","options":{"A":"Maintain a stakeholder register and notify the listed parties at every phase transition event.","B":"Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time.","C":"Archive every phase deliverable in long-term storage to preserve a record of what was produced.","D":"Capture lessons learned at the end of each phase and surface them as inputs to the next phase.","E":"Lock decisions made in early phases to prevent revisiting them as later phases begin."}},{"id":36,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"A","question":"You are a solution architect evaluating candidate use cases for a Claude-based program.\nFor each scenario, select Yes if Claude is appropriate as the primary solution, otherwise No.\n(1) Drafting first-pass investigative reports from semi-structured incident logs for analyst review.\n(2) Computing real-time fraud scores at sub-50-millisecond latency on a streaming pipeline.\n(3) Long-context contract review with structured clause extraction and deviation flagging.\n(4) Replacing a vector index for semantic retrieval over a multi-million-document corpus.\n(5) Routing inbound support tickets into 30 categories with reasoning for the selected route.","options":{"A":"Yes - No - Yes - No - Yes"}},{"id":37,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"A","question":"You are evaluating prompting claims in a peer's design document.\nFor each claim, select Yes if it reflects sound practice, otherwise No.\n(1) Zero-shot is appropriate as a starting point for closed-set classification when categories and descriptions are provided in the prompt.\n(2) Adding a few-shot example set with exact field names anchors output formatting on extraction tasks.\n(3) Chain-of-thought should be the default on every task regardless of complexity.\n(4) Leading-question framing is best mitigated by asking for an even-handed comparison with stated criteria.\n(5) Behavioral differences across model versions can be ignored once a prompt has been validated on one version.","options":{"A":"Yes - Yes - No - Yes - No"}},{"id":38,"domain":"practice-set-2","is_multi":true,"num_answers":2,"answer":"C,D","question":"A pilot AI assistant for procurement specialists shows 89% first-response acceptance, but follow-up surveys reveal that specialists frequently override the assistant's vendor recommendations after considering criteria the assistant did not evaluate. The pilot owner wants to ship the assistant unchanged.\nWhich two Discernment-competency observations should you raise BEFORE approving the launch? (Select two.)","options":{"A":"The acceptance rate alone proves readiness for general production use.","B":"The survey response rate may not be statistically representative of all specialists.","C":"The unconsidered criteria represent a scope gap in the assistant's input space.","D":"Acceptance does not establish whether recommendations remain correct after specialist review.","E":"The pilot duration was probably too short to demonstrate reliability across the full year."}},{"id":39,"domain":"practice-set-2","is_multi":true,"num_answers":2,"answer":"B,E","question":"An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures.\nWhich two investigative steps most directly isolate the root cause? (Select two.)","options":{"A":"Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes.","B":"Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window.","C":"Switch to a different Claude model tier to rule out provider-side changes as a contributing factor.","D":"Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures.","E":"Replay a set of premaintenance requests against the current configuration and inspect the raw model output before downstream parsing."}},{"id":40,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"A","question":"You are choosing the level of detail for an implementation guide. The audience is a delivery team that will build the deployment.\nWhich guidance composition best serves them?","options":{"A":"Component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks.","B":"Component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks.","C":"An architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration-parameter tables, or operational runbooks for the delivery team to follow.","D":"An architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation."}},{"id":41,"domain":"practice-set-2","is_multi":true,"num_answers":2,"answer":"D,E","question":"A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user.\nWhich two mitigations directly address these specific findings? (Select two.)","options":{"A":"Validate structured outputs against a schema before downstream actions are executed.","B":"Enforce RBAC at the retrieval layer before content enters the model context.","C":"Move credentials out of the prompt context and resolve them from a server-side secret store.","D":"Add actor attribution to tool-call logs so each call records the initiating user identity.","E":"Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions."}},{"id":42,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"B","question":"A customer support team has proposed delegating customer refund decisions to a Claude-driven workflow with no human review for refunds under 50 USD. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain.\nWhich Delegation-competency principle should guide your response?","options":{"A":"Delegation should always include human review on every decision the workflow produces.","B":"Delegation scope should reflect the type of risk involved, not the transaction size alone.","C":"Delegation scope should be set primarily by maximizing efficiency gains across the workflow.","D":"Delegation should be avoided entirely wherever financial transactions occur in the workflow."}},{"id":43,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"B","question":"You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's conventions and architecture in every session.\nWhich adjustment most directly removes this inefficiency?","options":{"A":"Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all AI-assisted development productivity for this codebase.","B":"Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically.","C":"Tell each engineer to retype the project conventions and architecture context more quickly at the start of each session, reducing time lost without eliminating the repeated manual effort.","D":"Remove all documented project conventions and architectural standards so engineers have nothing to re-explain at session start, accepting the loss of consistency and shared coding standards."}},{"id":44,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"B","question":"You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band.\nWhich response is most appropriate?","options":{"A":"Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population.","B":"Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release.","C":"Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population.","D":"Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset."}},{"id":45,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"A,E","question":"You are producing an architecture guide for a new deployment and must complete the planning steps before drafting each section.\nWhich two steps must be completed BEFORE drafting each section of the guide? (Select two.)","options":{"A":"Identify the audience and the questions the guide must answer for that audience.","B":"Translate the guide into the supported regional languages for the candidate population.","C":"Validate the guide with the implementation team and incorporate corrections.","D":"Establish the document under version control with a defined review cadence and approver list.","E":"Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations."}},{"id":46,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"D","question":"A technical team is debating whether to implement a new capability for generating regulatory filings from internal data as a Claude Skill or as an MCP server. The capability requires a fixed authoring procedure with embedded examples, does not need to call live external systems, and must be portable across three Claude deployments.\nWhich factor most strongly favors implementing the capability as a Skill?","options":{"A":"The capability needs to query a live database for the most recent regulatory filings.","B":"The capability must also be callable from a developer's command-line interface.","C":"The capability requires direct authentication against the corporate identity provider.","D":"The capability is procedural knowledge with no live external-system calls required."}},{"id":47,"domain":"practice-set-6","is_multi":true,"num_answers":2,"answer":"A,D","question":"A Claude architect is leading the discovery phase for a new AI-powered customer service solution.\nWhich two activities are characteristic of structured discovery and requirement gathering for a Claude-based deployment? (Select two.)","options":{"A":"Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins.","B":"Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected.","C":"Generating an initial prototype and iterating based on user reaction rather than written requirements.","D":"Documenting explicit success criteria and failure thresholds that will gate production deployment.","E":"Deferring constraint documentation until the integration design phase to avoid scope creep."}},{"id":48,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"A","question":"You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review.\nFor each tool, select Yes if it should remain after a least-privilege audit, otherwise No.\n(1) read-only catalog lookup tool. (2) inbox-send tool that emails purchase requests to vendors directly. (3) draft-write tool that creates purchase-request drafts in the review queue. (4) production-database admin tool unrelated to procurement. (5) read-only policy-document tool.","options":{"A":"Yes - No - Yes - No - Yes"}},{"id":49,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"B,E","question":"You are building an ethics review checklist for deployments supported by artificial intelligence (AI).\nWhich two checks belong on the list? (Select two.)","options":{"A":"Confirm that vendor licensing terms permit the planned production use of the model.","B":"Confirm that high-impact decisions retain human accountability rather than being attributed to the model.","C":"Restrict the ethics review to outputs that exceed a defined model-confidence threshold.","D":"Confirm that latency and throughput targets are met across the supported user populations.","E":"Verify that outputs do not rely on generalizations about people that the underlying data does not support."}},{"id":50,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"A,B","question":"The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume Claude pipeline without degrading output quality on the core use case.\nWhich two optimizations directly target both cost and latency simultaneously? (Select two.)","options":{"A":"Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls.","B":"Route straightforward query types to a smaller, faster Claude model and reserve the full model for complex cases.","C":"Increase max_tokens to reduce the frequency of truncated responses requiring follow-up calls.","D":"Add a retrieval step that fetches the full source corpus into the context window before generation.","E":"Expand the system prompt to include additional few-shot examples on every request."}},{"id":51,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"C,E","question":"A security team is evaluating two proposed controls. Control A adds an outbound tool allow-list with destination restrictions and per-call review. Control B scores responses against a stable adversarial evaluation set after each model-version change.\nWhich two risk categories are correctly matched to these controls? (Select two.)","options":{"A":"Control A - prompt injection from adversarial content in retrieved data","B":"Control A - silent quality drift after a model-version upgrade","C":"Control A - data exfiltration via outbound tool calls","D":"Control B - data exfiltration via outbound tool calls","E":"Control B - silent quality drift after a model-version upgrade"}},{"id":52,"domain":"practice-set-2","is_multi":true,"num_answers":2,"answer":"C,D","question":"An architect is reviewing a Claude-based candidate-screening tool prior to deployment. A stakeholder asserts that because the model was not trained on company data, no bias evaluation is necessary.\nWhich two responses most accurately challenge this assertion? (Select two.)","options":{"A":"Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation.","B":"Fairness testing is required only when the training dataset is known to contain protected-class labels.","C":"The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning.","D":"The system should be evaluated on outcome-disparity metrics across protected groups before deployment.","E":"Bias evaluation is unnecessary when the model provider has published a responsible-use policy."}},{"id":53,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"D","question":"A business sponsor has requested an AI solution to 'improve customer experience.' The sponsor cannot articulate which customer journey is failing, which metric reflects the failure, or which decisions the AI should support. The sponsor is asking you to begin design work next week.\nWhich delegation-competency action should you take first?","options":{"A":"Recommend that the sponsor revise the request and resubmit it later for evaluation.","B":"Begin prototyping a generic assistant against the broad request before the next deadline.","C":"Propose a fixed scope that you commit to by default based on your own assumptions.","D":"Facilitate a structured discovery to define the failing decision and the target metric."}},{"id":54,"domain":"practice-set-6","is_multi":true,"num_answers":2,"answer":"A,E","question":"The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. The procedure changes when regulators issue updates, currently four to six times per year.\nWhich two design decisions should you include? (Select two.)","options":{"A":"Package the procedure as a Claude Skill owned directly by the compliance team.","B":"Embed the procedure text into each workflow's system prompt at integration time.","C":"Store the procedure in a shared retrieval corpus accessed by all three workflows.","D":"Have each workflow team rewrite the procedure for its own context.","E":"Reference the same Claude Skill from all three workflow integrations."}},{"id":55,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"C","question":"You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request.\nWhich optimization most directly targets the dominant cost driver?","options":{"A":"Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them.","B":"Add additional repeated content to the system prompt to give the model more guidance.","C":"Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query.","D":"Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver."}},{"id":56,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"B,E","question":"You are integrating Claude Code into a team workflow and must complete the design and configuration steps before piloting the integrated workflow with a small group.\nWhich two steps must be completed BEFORE piloting the integrated workflow? (Select two.)","options":{"A":"Document the integrated workflow with handoff criteria, permission boundaries, and on-call runbooks.","B":"Identify the workflow steps where AI-assisted tooling adds value and where human authority must remain.","C":"Negotiate the workflow change with affected teams and obtain formal sign-off from each manager.","D":"Iterate the integrated workflow based on pilot findings before broader rollout to the team.","E":"Configure the project-scope MCP servers, permissions, subagents, and persistent project context."}},{"id":57,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"A,C","question":"You are running a controlled experiment to compare two prompts and must complete the design steps before executing the experiment.\nWhich two steps must be completed BEFORE running the experiment with random assignment? (Select two.)","options":{"A":"Determine the minimum detectable effect size and the sample size needed for power.","B":"Decide whether to promote, reject, or iterate the candidate based on the analysis.","C":"Define the hypothesis and the primary success metric for the comparison.","D":"Analyze the results against the predefined success metric and significance threshold.","E":"Document the recommendation, the trade-offs accepted, and the alternatives considered."}},{"id":58,"domain":"practice-set-6","is_multi":true,"num_answers":2,"answer":"A,D","question":"You are listing characteristics of strong architectural-decision communication.\nWhich two characteristics belong on the list? (Select two.)","options":{"A":"Ownership and review cadence for revisiting the decision when conditions or assumptions change.","B":"Distribution to a standing review forum with mandatory attendance from senior engineering leaders.","C":"Omission of rejected alternatives to keep the decision document focused and concise for readers.","D":"Alternatives considered along with the criteria that were used to evaluate each alternative.","E":"Use of a consistent template across the team to standardize the visual presentation of decisions."}},{"id":59,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"B","question":"You are diagnosing a Claude Code session whose subagent uses 50,000 tokens of context before the engineer types a single message.\nWhich root cause is most likely?","options":{"A":"The developer's keyboard layout or input-method configuration is the cause of the elevated context consumption, introducing extra tokens before the engineer types any message.","B":"Many MCP servers are configured, each contributing tool definitions to the context budget; Tool Search is not enabled, so all definitions load upfront.","C":"The model has internal personal preferences or default behaviors that silently consume large portions of context budget before any user message is processed, independent of tool configuration.","D":"The font rendering or display-scaling settings of the IDE are converting visual output into additional context tokens, causing the high pre-session context consumption."}},{"id":60,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"A,B","question":"A Claude architect is configuring a shared Claude Code environment for a twelve-person development team.\nWhich two configuration decisions most directly establish a consistent, secure team environment? (Select two.)","options":{"A":"Commit shared MCP server definitions and tool permissions in project-scope configuration files alongside the repository.","B":"Apply managed configuration to enforce non-overridable security and compliance policies across all team members.","C":"Set editor theme and display preferences at the project scope so they are uniform across workstations.","D":"Instruct each engineer to configure their preferred Claude model in personal user-scope settings.","E":"Store the team's shared API key in the project-scope settings.json so all engineers use the same credential."}},{"id":61,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"B","question":"You are reviewing a peer's draft architecture decision record (ADR). The ADR states the decision and the technical detail but does not state the alternatives considered or the trade-offs accepted.\nWhich response is most appropriate?","options":{"A":"Delete the ADR entirely and rely on the engineering team's collective memory to reconstruct the decision context, alternatives, and trade-offs during future audits or onboarding.","B":"Ask the author to add the alternatives considered and the trade-offs accepted before publishing the ADR.","C":"Approve the ADR as written on the grounds that the decision itself is documented, accepting that reviewers and future maintainers will lack the context to evaluate or revisit it.","D":"Replace the ADR with a different decision unrelated to the one drafted."}},{"id":62,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"A,C","question":"A research summarization assistant has been deployed for six months. A user flagged that a generated summary contained a fabricated citation. The product team asked whether the incident requires architectural action or is an isolated case.\nWhich two Diligence-competency actions should you take? (Select two.)","options":{"A":"Sample recent summaries to estimate the fabrication frequency across the population.","B":"Disable the assistant immediately for all current users without any prior diagnostic analysis.","C":"Review whether citation-grounding controls exist anywhere in the current generation pipeline.","D":"Communicate to users that the assistant does not fabricate output as a matter of design.","E":"Treat the incident as an anecdotal isolated case and take no further investigative action."}},{"id":63,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"B","question":"You are configuring tool permissions for a Claude-based assistant. The assistant's defined responsibilities require read access to a knowledge base and write access to a draft queue, and nothing else.\nWhich scoping design best applies least privilege?","options":{"A":"Allow access to all tools with read permissions globally and restrict write permissions to the draft-queue tool, without scoping to only the specific tools required for defined tasks.","B":"Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer.","C":"Allow access to every tool in the catalog and rely on the model to decline tools it should not use.","D":"Disable all tools entirely to achieve a minimal permission surface, accepting that the assistant can no longer perform the read-knowledge-base or write-draft-queue tasks it was designed for."}},{"id":64,"domain":"practice-set-6","is_multi":false,"num_answers":1,"answer":"C","question":"You are explaining the precedence of Claude Code configuration scopes to the team.\nWhich precedence ordering, from highest to lowest, is correct?","options":{"A":"Local # managed # user # command-line arguments # project","B":"Project # user # managed # local # command-line arguments","C":"Managed # command-line arguments # local # project # user","D":"User # project # local # command-line arguments # managed"}},{"id":65,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"D","question":"You are an architect supporting the iteration phase of a deployed Claude-based system.\nWhich activity most directly fits this phase?","options":{"A":"Rebuild the entire system architecture from scratch at the start of every iteration cycle regardless of what production telemetry, evaluations, and stakeholder feedback indicate is needed.","B":"Stop measuring production outcomes once the deployment has successfully launched, treating the go-live milestone as the end of the evaluation and iteration cycle.","C":"Discard the evaluation framework and reference set once the deployment is in production, accepting that future iterations will have no structured basis for measuring the impact of changes.","D":"Review production telemetry, sampled output evaluations, and stakeholder feedback to identify the highest-impact change for the next cycle, then plan the change against the evaluation framework."}},{"id":66,"domain":"practice-set-2","is_multi":true,"num_answers":2,"answer":"A,D","question":"You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data.\nWhich two test types should be prioritized to cover both safety under attack and cross-component correctness? (Select two.)","options":{"A":"Adversarial tests using prompt-injection and malformed-input cases.","B":"Regression tests against a stable reference set of previously known-good outputs.","C":"Smoke tests that verify core paths after each deployment.","D":"Integration tests that verify end-to-end pipeline behavior across all components.","E":"Unit tests targeting only individual prompt-template rendering logic."}},{"id":67,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"B","question":"You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role.\nWhere should role-based access control be enforced in the pipeline?","options":{"A":"Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents.","B":"At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model.","C":"Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control.","D":"After the response is generated, by post-filtering content that should not have been retrieved."}},{"id":68,"domain":"practice-set-3","is_multi":false,"num_answers":1,"answer":"B","question":"You are integrating human review into a high-volume classification pipeline where reviewing every output is infeasible.\nWhich sampling strategy best balances throughput with quality oversight?","options":{"A":"No sampling, relying entirely on user complaints to reveal quality and safety problems after they affect users.","B":"Risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs.","C":"Inverse sampling that reviews only high-confidence routine outputs and skips low-confidence and high-impact outputs.","D":"Universal review of every output regardless of confidence or throughput impact."}},{"id":69,"domain":"practice-set-3","is_multi":true,"num_answers":2,"answer":"B,E","question":"You are listing characteristics of robust guardrail design for an enterprise deployment.\nWhich two characteristics belong on the list? (Select two.)","options":{"A":"Centralized log retention for guardrail violations with quarterly review by the security team.","B":"Per-role tool allow-lists enforced at the orchestration layer before any tool call executes.","C":"User feedback channels that route reported guardrail failures into the product backlog for triage.","D":"Periodic refresh of the system prompt wording to keep refusal language current and clear.","E":"Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance."}},{"id":70,"domain":"practice-set-2","is_multi":true,"num_answers":2,"answer":"B,C","question":"The engineering lead at Trenova Systems, Inc. is evaluating two proposals: Proposal A adds Claude Code to the IDE for inline code generation and review. Proposal B routes all code-generation requests through a shared Slack bot without IDE integration.\nWhich two observations most accurately evaluate these proposals against workflow-improvement objectives? (Select two.)","options":{"A":"Proposal B is superior because centralizing requests in Slack creates an auditable log of all code-generation activity.","B":"Proposal B introduces workflow friction by requiring developers to leave the IDE, undermining the productivity objective.","C":"Proposal A reduces context switching by providing AI assistance at the point of development without requiring a separate tool.","D":"Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue.","E":"Both proposals are equivalent because the model capabilities are identical regardless of the integration point."}},{"id":71,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"D","question":"You must present an architectural recommendation to deploy a Claude-based contract review assistant to a steering committee that includes the CFO, the general counsel, and the CIO. Each stakeholder cares about different aspects of the decision.\nHow should you structure the recommendation document?","options":{"A":"Lead with the technical architecture diagram and the full component list before any other section.","B":"Lead with detailed cost projections across the full multi-year horizon before the rationale section.","C":"Present the same dense narrative throughout with no stakeholder differentiation in any section.","D":"Lead with the architectural decision, then address each stakeholder's primary concerns directly."}},{"id":72,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"A","question":"You are sequencing decomposed components in an invoice-processing pipeline.\nFor each component, select Pre-Processing, Model Stage, or Post-Processing.\n(1) Claude-based classification of invoice type. (2) persistence of validated records to the system of record. (3) schema validation of the extracted fields. (4) Claude-based extraction of structured invoice fields. (5) PII redaction on extracted text prior to model invocation. (6) optical character recognition on scanned invoice images.","options":{"A":"Model Stage - Post-Processing - Post-Processing - Model Stage - Pre-Processing - Pre-Processing"}},{"id":73,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"A","question":"You are classifying chunking strategies by the corpus type each is best suited to.\n(1) function-level or section-level chunking for code modules. (2) tree-aware chunking that follows code or specification hierarchy. (3) per-record chunking where each record is one chunk. (4) semantic chunking along clause or paragraph boundaries. (5) fixed-size chunking with overlap for short records of similar length. (6) hierarchical chunking that mirrors document section structure.\nCorpus types: Long Structured Documents, Heterogeneous Short Records, Code or Hierarchical Specifications.","options":{"A":"Code or Hierarchical Specifications - Code or Hierarchical Specifications - Heterogeneous Short Records - Long Structured Documents - Heterogeneous Short Records - Long Structured Documents"}},{"id":74,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"C","question":"You are documenting an architectural decision to support future audit and onboarding.\nWhich artifact is the strongest fit?","options":{"A":"A slide deck in a presentation folder with no accompanying written rationale.","B":"A code comment in a single file that contains an opinion of one engineer.","C":"An Architecture Decision Record that states the context, the decision, the alternatives considered, the consequences, and the date and authors.","D":"A short verbal note shared during a hallway conversation with no written record."}},{"id":75,"domain":"practice-set-5","is_multi":false,"num_answers":1,"answer":"C","question":"When communicating an architectural decision to a security and compliance reviewer, which content set is most aligned with that audience's primary concerns?","options":{"A":"Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager.","B":"Implementation timeline, component interfaces, and deployment sequence for the engineering team.","C":"Threat model, control mappings, residual-risk acceptance criteria, and audit traceability.","D":"Decision rationale, business outcomes, and high-level risk summary for executive review."}},{"id":76,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"A,B","question":"You are compiling team-setup practices for a Claude Code rollout across an engineering organization.\nWhich two practices belong on the list? (Select two.)","options":{"A":"Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control.","B":"Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers.","C":"Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work.","D":"Use user scope for team-shared MCP servers so every engineer on the team has consistent access.","E":"Use project scope for personal editor preferences so the preferences apply consistently within the project."}},{"id":77,"domain":"practice-set-5","is_multi":true,"num_answers":2,"answer":"A,C","question":"You are rolling out monitoring for a Claude-based deployment and must complete the specification steps before instrumenting the deployment.\nWhich two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces? (Select two.)","options":{"A":"Define the metrics and the slices the deployment will monitor across normal and adversarial traffic.","B":"Tune the alert thresholds based on observed normal-state distributions to reduce false positives.","C":"Define the service-level objectives (SLOs) and the error budgets the deployment will be held to.","D":"Build the dashboards that surface metrics across slices at the cadence the team operates on.","E":"Document the dashboards, alerts, and runbooks for the on-call rotation that will respond."}},{"id":78,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"D","question":"You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata, classify, summarize, and persist.\nWhich pattern is the best fit and why?","options":{"A":"A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store.","B":"An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks.","C":"An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability.","D":"A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility."}},{"id":79,"domain":"practice-set-1","is_multi":false,"num_answers":1,"answer":"A","question":"You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch.\nWhich response is most appropriate?","options":{"A":"Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed.","B":"Reinstall the operating system to clear all permission state without first confirming whether the one-time permission grant caused the failure.","C":"Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs.","D":"Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed."}},{"id":80,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"C","question":"You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI.\nWhich transparency practice most directly supports responsible deployment?","options":{"A":"Misrepresent the AI's role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency.","B":"Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information.","C":"Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed.","D":"Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system."}},{"id":81,"domain":"practice-set-2","is_multi":false,"num_answers":1,"answer":"D","question":"You are assessing a Claude-based system whose dominant risk is silent quality drift on safety-relevant outputs after a model-version upgrade.\nWhich assessment activity most directly addresses this risk?","options":{"A":"Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production.","B":"Rotate adversarial inputs randomly so no two upgrades are scored on the same set.","C":"Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic.","D":"Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion."}},{"id":82,"domain":"practice-set-1","is_multi":true,"num_answers":2,"answer":"C,D","question":"An architect at Trenova Systems, Inc. is reviewing two draft communication packages for the same architectural decision. Package 1 contains a threat model, residual-risk register, and control-mapping table. Package 2 contains a list of capabilities delivered and feature-level roadmap dependencies.\nWhich two audiences are correctly matched to these packages? (Select two.)","options":{"A":"Package 1 # engineering implementation team","B":"Package 2 # executive sponsor","C":"Package 1 # security and compliance reviewer","D":"Package 2 # product manager owning the roadmap","E":"Package 2 # security and compliance reviewer"}},{"id":83,"domain":"practice-set-4","is_multi":false,"num_answers":1,"answer":"C","question":"You are identifying the highest-impact optimization for a deployment whose token
